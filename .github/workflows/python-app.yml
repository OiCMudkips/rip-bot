name: rip-bot Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: "pip"
    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt;
    - name: Test with pytest
      run: |
        pytest
